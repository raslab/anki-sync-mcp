services:
  anki-mcp:
    build:
      context: .
    image: anki-mcp:0.1.0
    restart: unless-stopped
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_AUTH_TOKEN_FILE: "/run/secrets/anki_mcp_token"
      ANKI_COLLECTION_PATH: "/data/collection.anki2"
      MCP_MAX_PAGE_SIZE: "100"
    secrets:
      - anki_mcp_token
    volumes:
      - anki_data:/data
    networks:
      - assistant
    expose:
      - "8000"

secrets:
  anki_mcp_token:
    file: ./secrets/anki_mcp_token

volumes:
  anki_data:

networks:
  assistant:
    internal: true
